name: Ubergraph subset journal
description: >
  Restore ubergraph/ubergraph-subset.jnl from the Actions cache, keyed on the
  Ubergraph dump's Last-Modified date and the subset build scripts. On a cache
  miss (new Ubergraph release or changed scripts) rebuild it from the N-Quads
  dump and save it. If RENCI is unreachable, fall back to the newest cached journal.

runs:
  using: composite
  steps:
    - name: Get Ubergraph release date
      id: version
      shell: bash
      run: |
        modified=$(curl -sfIL --retry 3 https://ubergraph.apps.renci.org/downloads/current/ubergraph.nq.gz \
          | grep -i '^last-modified:' | tail -1 | cut -d' ' -f2- | tr -dc 'A-Za-z0-9') || true
        echo "Ubergraph dump Last-Modified: ${modified:-unknown}"
        echo "version=${modified:-unknown}" >> "$GITHUB_OUTPUT"

    # Key: the subset's build scripts + the Ubergraph release. A new release or a
    # change to the filter misses the primary key; restore-keys then restores the
    # newest journal built by the same scripts, as a fallback if the rebuild fails.
    - name: Restore cached subset journal
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ubergraph/ubergraph-subset.jnl
        key: ubergraph-subset-${{ hashFiles('src/ubergraph_subset.py', 'src/build_ubergraph_subset.sh') }}-${{ steps.version.outputs.version }}
        restore-keys: |
          ubergraph-subset-${{ hashFiles('src/ubergraph_subset.py', 'src/build_ubergraph_subset.sh') }}-

    - name: Build subset journal
      id: build
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: src
      run: |
        # rapidgzip (parallel gunzip) is in requirements.txt but not yet in the
        # ccf-tools-dep image; drop this once the image is rebuilt.
        python -m pip install rapidgzip
        # The build writes the journal atomically, so a failed rebuild leaves a
        # journal restored from an older cache entry in place.
        if make refresh-ubergraph; then
          echo "built=true" >> "$GITHUB_OUTPUT"
        elif [ -f ../ubergraph/ubergraph-subset.jnl ]; then
          echo "::warning::Could not rebuild the Ubergraph subset; using the most recent cached journal."
        else
          exit 1
        fi
        rm -rf ../ubergraph/subset-build

    - name: Save subset journal
      if: steps.build.outputs.built == 'true' && steps.version.outputs.version != 'unknown'
      uses: actions/cache/save@v4
      with:
        path: ubergraph/ubergraph-subset.jnl
        key: ${{ steps.cache.outputs.cache-primary-key }}
